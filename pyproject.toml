[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azsent"
version = "2.0.0"
description = "Domain-robust, polarity-injected sentence embeddings for Azerbaijani sentiment analysis - IEEE Access resubmission experiment suite"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
