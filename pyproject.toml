[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azsent"
version = "2.0.0"
description = "AzSentBench: experimental pipeline and audit tooling for the multi-domain Azerbaijani sentiment benchmark"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
